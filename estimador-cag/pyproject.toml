[project]
name = "estimador-cag"
version = "0.1.0"
description = "CAG-based software development estimator"
readme = "README.md"
authors = [
    { name = "mmoll-code", email = "mmollcuneo@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "openai>=3.16.2",
    "anthropic>=1.7.0",
    "httpx>=0.28.1",
    "streamlit",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
