[project]
name = "estimador-cag"
version = "0.1.0"
description = "CAG-based software development estimator"
readme = "README.md"
authors = [
    { name = "mmoll-code", email = "mmollcuneo@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "openai>=3.16.2",
    "anthropic>=1.7.0",
    "httpx>=0.28.1",
    "streamlit",
    "litellm>=1.50",
    "redis>=5.0",
    "sse-starlette>=2.1",
    "structlog>=24.0",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "fakeredis>=2.20",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
